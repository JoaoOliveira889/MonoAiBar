<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- macOS Icon Squircle Clip -->
    <clipPath id="macOSSquircle">
      <rect x="32" y="32" width="960" height="960" rx="224" ry="224" />
    </clipPath>

    <!-- CRT Screen Clip -->
    <clipPath id="crtScreenClip">
      <rect x="230" y="320" width="564" height="420" rx="36" ry="36" />
    </clipPath>

    <!-- Gradients -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D29"/>
      <stop offset="50%" stop-color="#0F131C"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>

    <linearGradient id="monitorBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4356"/>
      <stop offset="30%" stop-color="#2B3242"/>
      <stop offset="100%" stop-color="#1B202B"/>
    </linearGradient>

    <linearGradient id="monitorTopVent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B566D"/>
      <stop offset="50%" stop-color="#3A4457"/>
      <stop offset="100%" stop-color="#282F3E"/>
    </linearGradient>

    <linearGradient id="screenBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#202633"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>

    <linearGradient id="crtGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A111C"/>
      <stop offset="50%" stop-color="#060A10"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <linearGradient id="screenGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group with macOS Squircle Clip -->
  <g clip-path="url(#macOSSquircle)">
    <!-- 1. Background Surface -->
    <rect x="32" y="32" width="960" height="960" fill="url(#squircleBg)"/>

    <!-- Subtle Ambient Backdrop Glow -->
    <circle cx="512" cy="480" r="380" fill="#38BDF8" opacity="0.07" filter="url(#neonGlow)"/>
    <circle cx="512" cy="560" r="320" fill="#F43F5E" opacity="0.05" filter="url(#neonGlow)"/>

    <!-- 2. CRT Terminal Base Drop Shadow -->
    <rect x="160" y="210" width="704" height="660" rx="72" fill="#000000" opacity="0.6"/>

    <!-- 3. CRT Monitor Chassis (Main Body) -->
    <!-- Top Angled Grille / Cooling Vents -->
    <path d="M 230 185 L 794 185 L 850 250 L 174 250 Z" fill="url(#monitorTopVent)"/>
    <!-- Vents Slats -->
    <g stroke="#151922" stroke-width="6" stroke-linecap="round">
      <line x1="280" y1="205" x2="315" y2="235"/>
      <line x1="330" y1="205" x2="365" y2="235"/>
      <line x1="380" y1="205" x2="415" y2="235"/>
      <line x1="430" y1="205" x2="465" y2="235"/>
      <line x1="480" y1="205" x2="515" y2="235"/>
      <line x1="530" y1="205" x2="565" y2="235"/>
      <line x1="580" y1="205" x2="615" y2="235"/>
      <line x1="630" y1="205" x2="665" y2="235"/>
      <line x1="680" y1="205" x2="715" y2="235"/>
      <line x1="730" y1="205" x2="765" y2="235"/>
    </g>
    <!-- Top Rim Accent Line -->
    <line x1="230" y1="185" x2="794" y2="185" stroke="#5B6882" stroke-width="4"/>

    <!-- Main Front Bezel Block -->
    <rect x="174" y="240" width="676" height="610" rx="58" fill="url(#monitorBody)"/>
    <!-- Outer Bezel Stroke -->
    <rect x="174" y="240" width="676" height="610" rx="58" fill="none" stroke="#4F5B73" stroke-width="4"/>
    <!-- Bottom Shadow Step -->
    <rect x="200" y="845" width="624" height="24" rx="8" fill="#131720"/>

    <!-- Inner Screen Inset Frame -->
    <rect x="212" y="298" width="600" height="464" rx="44" fill="url(#screenBezel)"/>
    <rect x="212" y="298" width="600" height="464" rx="44" fill="none" stroke="#12161E" stroke-width="4"/>

    <!-- 4. CRT Screen Surface -->
    <rect x="230" y="320" width="564" height="420" rx="36" fill="url(#crtGlass)"/>

    <!-- Content Inside CRT Screen (Clipped) -->
    <g clip-path="url(#crtScreenClip)">
      <!-- CRT Curved Scanlines -->
      <g stroke="#000000" stroke-opacity="0.35" stroke-width="3">
        <line x1="220" y1="335" x2="800" y2="335"/>
        <line x1="220" y1="355" x2="800" y2="355"/>
        <line x1="220" y1="375" x2="800" y2="375"/>
        <line x1="220" y1="395" x2="800" y2="395"/>
        <line x1="220" y1="415" x2="800" y2="415"/>
        <line x1="220" y1="435" x2="800" y2="435"/>
        <line x1="220" y1="455" x2="800" y2="455"/>
        <line x1="220" y1="475" x2="800" y2="475"/>
        <line x1="220" y1="495" x2="800" y2="495"/>
        <line x1="220" y1="515" x2="800" y2="515"/>
        <line x1="220" y1="535" x2="800" y2="535"/>
        <line x1="220" y1="555" x2="800" y2="555"/>
        <line x1="220" y1="575" x2="800" y2="575"/>
        <line x1="220" y1="595" x2="800" y2="595"/>
        <line x1="220" y1="615" x2="800" y2="615"/>
        <line x1="220" y1="635" x2="800" y2="635"/>
        <line x1="220" y1="655" x2="800" y2="655"/>
        <line x1="220" y1="675" x2="800" y2="675"/>
        <line x1="220" y1="695" x2="800" y2="695"/>
        <line x1="220" y1="715" x2="800" y2="715"/>
        <line x1="220" y1="735" x2="800" y2="735"/>
      </g>

      <!-- A. Neural AI Constellation Lattice (Top Screen Area) -->
      <!-- Connections -->
      <g stroke-width="2.5" stroke-linecap="round" opacity="0.85">
        <!-- Cyan Synapses -->
        <line x1="310" y1="425" x2="360" y2="380" stroke="#38BDF8"/>
        <line x1="360" y1="380" x2="430" y2="435" stroke="#38BDF8"/>
        <line x1="310" y1="425" x2="370" y2="480" stroke="#38BDF8"/>
        <line x1="370" y1="480" x2="430" y2="435" stroke="#38BDF8"/>
        <line x1="430" y1="435" x2="495" y2="370" stroke="#38BDF8"/>
        <line x1="430" y1="435" x2="505" y2="465" stroke="#38BDF8"/>
        <line x1="495" y1="370" x2="505" y2="465" stroke="#818CF8"/>
        
        <!-- Purple/Magenta Synapses -->
        <line x1="495" y1="370" x2="580" y2="395" stroke="#818CF8"/>
        <line x1="505" y1="465" x2="580" y2="450" stroke="#818CF8"/>
        <line x1="580" y1="395" x2="580" y2="450" stroke="#A855F7"/>
        <line x1="580" y1="395" x2="655" y2="375" stroke="#F43F5E"/>
        <line x1="580" y1="450" x2="640" y2="490" stroke="#F43F5E"/>
        <line x1="580" y1="450" x2="710" y2="430" stroke="#F43F5E"/>
        <line x1="655" y1="375" x2="710" y2="430" stroke="#F43F5E"/>
        <line x1="640" y1="490" x2="710" y2="430" stroke="#F43F5E"/>
      </g>

      <!-- Neural Synapse Nodes -->
      <g filter="url(#softGlow)">
        <!-- Node 1 -->
        <circle cx="310" cy="425" r="9" fill="#38BDF8"/>
        <circle cx="310" cy="425" r="4" fill="#FFFFFF"/>

        <!-- Node 2 -->
        <circle cx="360" cy="380" r="10" fill="#38BDF8"/>
        <circle cx="360" cy="380" r="5" fill="#FFFFFF"/>

        <!-- Node 3 -->
        <circle cx="370" cy="480" r="8" fill="#38BDF8"/>
        <circle cx="370" cy="480" r="4" fill="#FFFFFF"/>

        <!-- Node 4 (Center Nexus) -->
        <circle cx="430" cy="435" r="12" fill="#38BDF8"/>
        <circle cx="430" cy="435" r="6" fill="#FFFFFF"/>

        <!-- Node 5 -->
        <circle cx="495" cy="370" r="11" fill="#67E8F9"/>
        <circle cx="495" cy="370" r="5" fill="#FFFFFF"/>

        <!-- Node 6 -->
        <circle cx="505" cy="465" r="9" fill="#818CF8"/>
        <circle cx="505" cy="465" r="4" fill="#FFFFFF"/>

        <!-- Node 7 -->
        <circle cx="580" cy="395" r="10" fill="#A855F7"/>
        <circle cx="580" cy="395" r="5" fill="#FFFFFF"/>

        <!-- Node 8 -->
        <circle cx="580" cy="450" r="9" fill="#C084FC"/>
        <circle cx="580" cy="450" r="4" fill="#FFFFFF"/>

        <!-- Node 9 -->
        <circle cx="655" cy="375" r="10" fill="#F43F5E"/>
        <circle cx="655" cy="375" r="5" fill="#FFFFFF"/>

        <!-- Node 10 -->
        <circle cx="640" cy="490" r="9" fill="#FB7185"/>
        <circle cx="640" cy="490" r="4" fill="#FFFFFF"/>

        <!-- Node 11 -->
        <circle cx="710" cy="430" r="11" fill="#F43F5E"/>
        <circle cx="710" cy="430" r="5" fill="#FFFFFF"/>
      </g>

      <!-- B. Digital LED Equalizer Quota Meter (Bottom Screen Area) -->
      <!-- Meter Grid Box -->
      <rect x="256" y="555" width="512" height="155" rx="14" fill="#04060A" opacity="0.75" stroke="#1A2233" stroke-width="2"/>

      <g transform="translate(275, 570)">
        <!-- Col 1 (Cyan - Claude 5h Session) -->
        <rect x="0" y="88" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="0" y="72" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="0" y="56" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="0" y="40" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="0" y="24" width="34" height="12" rx="3" fill="#0E2338"/>
        <rect x="0" y="8" width="34" height="12" rx="3" fill="#0E2338"/>

        <!-- Col 2 (Cyan - Claude Weekly) -->
        <rect x="44" y="88" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="44" y="72" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="44" y="56" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="44" y="40" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="44" y="24" width="34" height="12" rx="3" fill="#38BDF8"/>
        <rect x="44" y="8" width="34" height="12" rx="3" fill="#0E2338"/>

        <!-- Col 3 (Mint - Antigravity Gemini) -->
        <rect x="88" y="88" width="34" height="12" rx="3" fill="#34D399"/>
        <rect x="88" y="72" width="34" height="12" rx="3" fill="#34D399"/>
        <rect x="88" y="56" width="34" height="12" rx="3" fill="#0D2E24"/>
        <rect x="88" y="40" width="34" height="12" rx="3" fill="#0D2E24"/>
        <rect x="88" y="24" width="34" height="12" rx="3" fill="#0D2E24"/>
        <rect x="88" y="8" width="34" height="12" rx="3" fill="#0D2E24"/>

        <!-- Col 4 (Mint - Antigravity Claude/GPT) -->
        <rect x="132" y="88" width="34" height="12" rx="3" fill="#34D399"/>
        <rect x="132" y="72" width="34" height="12" rx="3" fill="#34D399"/>
        <rect x="132" y="56" width="34" height="12" rx="3" fill="#34D399"/>
        <rect x="132" y="40" width="34" height="12" rx="3" fill="#0D2E24"/>
        <rect x="132" y="24" width="34" height="12" rx="3" fill="#0D2E24"/>
        <rect x="132" y="8" width="34" height="12" rx="3" fill="#0D2E24"/>

        <!-- Col 5 (Indigo - Codex) -->
        <rect x="176" y="88" width="34" height="12" rx="3" fill="#818CF8"/>
        <rect x="176" y="72" width="34" height="12" rx="3" fill="#818CF8"/>
        <rect x="176" y="56" width="34" height="12" rx="3" fill="#818CF8"/>
        <rect x="176" y="40" width="34" height="12" rx="3" fill="#818CF8"/>
        <rect x="176" y="24" width="34" height="12" rx="3" fill="#1C2145"/>
        <rect x="176" y="8" width="34" height="12" rx="3" fill="#1C2145"/>

        <!-- Col 6 (Purple - Cursor) -->
        <rect x="220" y="88" width="34" height="12" rx="3" fill="#A855F7"/>
        <rect x="220" y="72" width="34" height="12" rx="3" fill="#A855F7"/>
        <rect x="220" y="56" width="34" height="12" rx="3" fill="#25163C"/>
        <rect x="220" y="40" width="34" height="12" rx="3" fill="#25163C"/>
        <rect x="220" y="24" width="34" height="12" rx="3" fill="#25163C"/>
        <rect x="220" y="8" width="34" height="12" rx="3" fill="#25163C"/>

        <!-- Col 7 (Orange - Grok) -->
        <rect x="264" y="88" width="34" height="12" rx="3" fill="#FB923C"/>
        <rect x="264" y="72" width="34" height="12" rx="3" fill="#FB923C"/>
        <rect x="264" y="56" width="34" height="12" rx="3" fill="#FB923C"/>
        <rect x="264" y="40" width="34" height="12" rx="3" fill="#FB923C"/>
        <rect x="264" y="24" width="34" height="12" rx="3" fill="#FB923C"/>
        <rect x="264" y="8" width="34" height="12" rx="3" fill="#3D200A"/>

        <!-- Col 8 (Coral / Magenta - Kimi / DeepSeek) -->
        <rect x="308" y="88" width="34" height="12" rx="3" fill="#F43F5E"/>
        <rect x="308" y="72" width="34" height="12" rx="3" fill="#F43F5E"/>
        <rect x="308" y="56" width="34" height="12" rx="3" fill="#F43F5E"/>
        <rect x="308" y="40" width="34" height="12" rx="3" fill="#3D0F18"/>
        <rect x="308" y="24" width="34" height="12" rx="3" fill="#3D0F18"/>
        <rect x="308" y="8" width="34" height="12" rx="3" fill="#3D0F18"/>

        <!-- Col 9 (Pink) -->
        <rect x="352" y="88" width="34" height="12" rx="3" fill="#EC4899"/>
        <rect x="352" y="72" width="34" height="12" rx="3" fill="#EC4899"/>
        <rect x="352" y="56" width="34" height="12" rx="3" fill="#EC4899"/>
        <rect x="352" y="40" width="34" height="12" rx="3" fill="#EC4899"/>
        <rect x="352" y="24" width="34" height="12" rx="3" fill="#3D1225"/>
        <rect x="352" y="8" width="34" height="12" rx="3" fill="#3D1225"/>

        <!-- Col 10 (Cyan High Quota) -->
        <rect x="396" y="88" width="34" height="12" rx="3" fill="#06B6D4"/>
        <rect x="396" y="72" width="34" height="12" rx="3" fill="#06B6D4"/>
        <rect x="396" y="56" width="34" height="12" rx="3" fill="#082A33"/>
        <rect x="396" y="40" width="34" height="12" rx="3" fill="#082A33"/>
        <rect x="396" y="24" width="34" height="12" rx="3" fill="#082A33"/>
        <rect x="396" y="8" width="34" height="12" rx="3" fill="#082A33"/>

        <!-- Col 11 (Emerald) -->
        <rect x="440" y="88" width="34" height="12" rx="3" fill="#10B981"/>
        <rect x="440" y="72" width="34" height="12" rx="3" fill="#10B981"/>
        <rect x="440" y="56" width="34" height="12" rx="3" fill="#10B981"/>
        <rect x="440" y="40" width="34" height="12" rx="3" fill="#10B981"/>
        <rect x="440" y="24" width="34" height="12" rx="3" fill="#10B981"/>
        <rect x="440" y="8" width="34" height="12" rx="3" fill="#10B981"/>
      </g>

      <!-- Diagonal Glass Glare Reflection -->
      <polygon points="230,320 440,320 280,740 230,740" fill="url(#screenGlare)"/>
    </g>

    <!-- 5. Analog Controls Section (Below Screen) -->
    <!-- Circular Power Switch Button -->
    <g transform="translate(265, 792)">
      <circle cx="0" cy="0" r="22" fill="#1E2430" stroke="#333C4F" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#151A24"/>
      <!-- Glowing Power Symbol Ring -->
      <path d="M -5 -3 A 7 7 0 1 0 5 -3" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="-8" x2="0" y2="-2" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Dual Rotary Knob Dials -->
    <g transform="translate(325, 792)">
      <circle cx="0" cy="0" r="14" fill="#1F2533" stroke="#343E54" stroke-width="2.5"/>
      <line x1="0" y1="-10" x2="0" y2="-3" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <g transform="translate(365, 792)">
      <circle cx="0" cy="0" r="14" fill="#1F2533" stroke="#343E54" stroke-width="2.5"/>
      <line x1="7" y1="-7" x2="2" y2="-2" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Right Side: Vintage Status Display / Badge Slot -->
    <rect x="670" y="782" width="120" height="20" rx="6" fill="#10141D" stroke="#252D3D" stroke-width="2"/>
    <rect x="676" y="788" width="24" height="8" rx="2" fill="#38BDF8" opacity="0.8"/>
    <rect x="706" y="788" width="40" height="8" rx="2" fill="#34D399" opacity="0.8"/>
    <rect x="752" y="788" width="32" height="8" rx="2" fill="#F43F5E" opacity="0.8"/>

    <!-- 6. Outer Beveled Rim of Squircle -->
    <rect x="34" y="34" width="956" height="956" rx="222" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
