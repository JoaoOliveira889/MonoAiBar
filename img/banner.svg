      <circle cx="85" cy="260" r="4" fill="#38BDF8"/>
      <circle cx="105" cy="260" r="5" fill="#1F2533" stroke="#343E54" stroke-width="1"/>
      <circle cx="118" cy="260" r="5" fill="#1F2533" stroke="#343E54" stroke-width="1"/>
