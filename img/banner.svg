          <!-- Col 4 -->
          <rect x="45" y="30" width="12" height="4" rx="1" fill="#34D399"/>
          <rect x="45" y="24" width="12" height="4" rx="1" fill="#34D399"/>
          <rect x="45" y="18" width="12" height="4" rx="1" fill="#34D399"/>
          <rect x="45" y="12" width="12" height="4" rx="1" fill="#0D2E24"/>
          <rect x="45" y="6" width="12" height="4" rx="1" fill="#0D2E24"/>
          <!-- Col 5 -->
          <rect x="60" y="30" width="12" height="4" rx="1" fill="#818CF8"/>
          <rect x="60" y="24" width="12" height="4" rx="1" fill="#818CF8"/>
          <rect x="60" y="18" width="12" height="4" rx="1" fill="#818CF8"/>
          <rect x="60" y="12" width="12" height="4" rx="1" fill="#1C2145"/>
