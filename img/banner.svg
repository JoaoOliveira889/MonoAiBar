<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="50%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>

    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <radialGradient id="meshGlow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08090D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowRight" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#08090D" stop-opacity="0"/>
    </radialGradient>

    <!-- CRT Shading for Embedded Icon -->
    <linearGradient id="iconSquircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D29"/>
      <stop offset="50%" stop-color="#0F131C"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>

    <linearGradient id="iconMonitorBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4356"/>
      <stop offset="30%" stop-color="#2B3242"/>
      <stop offset="100%" stop-color="#1B202B"/>
    </linearGradient>

    <linearGradient id="iconMonitorTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B566D"/>
      <stop offset="50%" stop-color="#3A4457"/>
      <stop offset="100%" stop-color="#282F3E"/>
    </linearGradient>

    <linearGradient id="iconCrtGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A111C"/>
      <stop offset="50%" stop-color="#060A10"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <clipPath id="bannerIconSquircle">
      <rect x="0" y="0" width="340" height="340" rx="78" ry="78"/>
    </clipPath>

    <clipPath id="bannerCrtClip">
      <rect x="73" y="103" width="194" height="144" rx="14"/>
    </clipPath>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="1200" height="440" rx="24" fill="url(#bgGradient)"/>
  <rect width="1200" height="440" rx="24" fill="url(#meshGlow)"/>
  <rect width="1200" height="440" rx="24" fill="url(#meshGlowRight)"/>
  <rect x="1.5" y="1.5" width="1197" height="437" rx="22.5" fill="none" stroke="#262C38" stroke-width="2"/>

  <!-- CRT Background Scanline Grid Motif -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="44" x2="1200" y2="44"/>
    <line x1="0" y1="88" x2="1200" y2="88"/>
    <line x1="0" y1="132" x2="1200" y2="132"/>
    <line x1="0" y1="176" x2="1200" y2="176"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="264" x2="1200" y2="264"/>
    <line x1="0" y1="308" x2="1200" y2="308"/>
    <line x1="0" y1="352" x2="1200" y2="352"/>
    <line x1="0" y1="396" x2="1200" y2="396"/>
