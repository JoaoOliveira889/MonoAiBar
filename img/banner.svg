          <rect x="75" y="24" width="12" height="4" rx="1" fill="#A855F7"/>
          <rect x="75" y="18" width="12" height="4" rx="1" fill="#25163C"/>
          <rect x="75" y="12" width="12" height="4" rx="1" fill="#25163C"/>
          <rect x="75" y="6" width="12" height="4" rx="1" fill="#25163C"/>
          <!-- Col 7 -->
