          <line x1="164" y1="119" x2="193" y2="127" stroke="#A855F7"/>
          <line x1="167" y1="151" x2="193" y2="146" stroke="#A855F7"/>
          <line x1="193" y1="127" x2="218" y2="120" stroke="#F43F5E"/>
          <line x1="193" y1="146" x2="213" y2="160" stroke="#F43F5E"/>
          <line x1="193" y1="146" x2="237" y2="139" stroke="#F43F5E"/>
          <line x1="218" y1="120" x2="237" y2="139" stroke="#F43F5E"/>
