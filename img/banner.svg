        <circle cx="16" cy="14" r="4" fill="#38BDF8"/>
        <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Apple Silicon (ARM64)</text>
