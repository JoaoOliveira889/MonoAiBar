          <line x1="70" y1="120" x2="270" y2="120"/>
          <line x1="70" y1="130" x2="270" y2="130"/>
          <line x1="70" y1="140" x2="270" y2="140"/>
          <line x1="70" y1="150" x2="270" y2="150"/>
          <line x1="70" y1="160" x2="270" y2="160"/>
          <line x1="70" y1="170" x2="270" y2="170"/>
          <line x1="70" y1="180" x2="270" y2="180"/>
          <line x1="70" y1="190" x2="270" y2="190"/>
          <line x1="70" y1="200" x2="270" y2="200"/>
