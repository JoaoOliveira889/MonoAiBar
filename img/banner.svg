          <rect x="90" y="24" width="12" height="4" rx="1" fill="#FB923C"/>
          <rect x="90" y="18" width="12" height="4" rx="1" fill="#FB923C"/>
          <rect x="90" y="12" width="12" height="4" rx="1" fill="#FB923C"/>
          <rect x="90" y="6" width="12" height="4" rx="1" fill="#3D200A"/>
          <!-- Col 8 -->
          <rect x="105" y="30" width="12" height="4" rx="1" fill="#F43F5E"/>
          <rect x="105" y="24" width="12" height="4" rx="1" fill="#F43F5E"/>
          <rect x="105" y="18" width="12" height="4" rx="1" fill="#F43F5E"/>
          <rect x="105" y="12" width="12" height="4" rx="1" fill="#3D0F18"/>
