        <rect width="80" height="26" rx="6" fill="#1D172B" stroke="#A855F7" stroke-opacity="0.6" stroke-width="1.2"/>
        <text x="40" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="700" fill="#A855F7">CSR</text>
      </g>

