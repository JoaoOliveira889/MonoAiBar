        <line x1="110" y1="67" x2="122" y2="78"/>
        <line x1="130" y1="67" x2="142" y2="78"/>
        <line x1="150" y1="67" x2="162" y2="78"/>
        <line x1="170" y1="67" x2="182" y2="78"/>
        <line x1="190" y1="67" x2="202" y2="78"/>
        <line x1="210" y1="67" x2="222" y2="78"/>
        <line x1="230" y1="67" x2="242" y2="78"/>
