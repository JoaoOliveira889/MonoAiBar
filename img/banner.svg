          <rect x="135" y="24" width="12" height="4" rx="1" fill="#10B981"/>
          <rect x="135" y="18" width="12" height="4" rx="1" fill="#10B981"/>
          <rect x="135" y="12" width="12" height="4" rx="1" fill="#10B981"/>
          <rect x="135" y="6" width="12" height="4" rx="1" fill="#10B981"/>
