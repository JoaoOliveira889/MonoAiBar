        <rect x="82" y="184" width="176" height="52" rx="5" fill="#04060A" opacity="0.8" stroke="#1A2233" stroke-width="1"/>
        <g transform="translate(89, 189)">
          <!-- Col 1 -->
          <rect x="0" y="30" width="12" height="4" rx="1" fill="#38BDF8"/>
          <rect x="0" y="24" width="12" height="4" rx="1" fill="#38BDF8"/>
          <rect x="0" y="18" width="12" height="4" rx="1" fill="#38BDF8"/>
          <rect x="0" y="12" width="12" height="4" rx="1" fill="#38BDF8"/>
