      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="62" font-weight="800" fill="url(#primaryAccent)" letter-spacing="-1.2">MonoAiBar</text>
    </g>

    <!-- Catchphrase and Subtext -->
