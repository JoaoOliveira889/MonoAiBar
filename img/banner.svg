      </text>
      <text y="25" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#64748B">
        Real-time 5-hour session quotas, reset countdowns, zero tokens consumed &amp; 100% private.
      </text>
    </g>

