        <text x="40" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="700" fill="#E2E8F0">GRK</text>
      </g>

      <!-- DeepSeek -->
      <g transform="translate(440, 0)">
        <rect width="80" height="26" rx="6" fill="#111B2C" stroke="#2563EB" stroke-opacity="0.6" stroke-width="1.2"/>
        <text x="40" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA">DSK</text>
      </g>

      <!-- Mint -->
      <g transform="translate(528, 0)">
        <rect width="80" height="26" rx="6" fill="#10251E" stroke="#14B8A6" stroke-opacity="0.6" stroke-width="1.2"/>
        <text x="40" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="700" fill="#2DD4BF">MNT</text>
      </g>

