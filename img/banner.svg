      <circle cx="14" cy="13" r="4" fill="#34D399"/>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="0.6">macOS MENU BAR APP</text>
    </g>

    <!-- Main App Name -->
